name: forex-ai
region: lon

domains:
  - domain: forex.sybexdesigns.co.uk
    type: PRIMARY

ingress:
  rules:
    - component:
        name: web
      match:
        path:
          prefix: /

services:
  - name: web
    github:
      repo: sybexdesign/forex-ai
      branch: main
      deploy_on_push: true
    build_command: npm install && npm run build
    run_command: npm run start
    environment_slug: node-js
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    http_port: 8080
    health_check:
      http_path: /
    envs:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: PORT
        value: "8080"
      - key: NEXTAUTH_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://lfurosnmkwvqtlifggaa.supabase.co
        scope: RUN_AND_BUILD_TIME
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmdXJvc25ta3d2cXRsaWZnZ2FhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MjQ4MzEsImV4cCI6MjA5MzMwMDgzMX0.ZWxFA-D57GqObQM_jSQ2PvNbqfxPOY4YBd__XZiFeWA
        scope: RUN_AND_BUILD_TIME
      - key: SUPABASE_URL
        value: https://lfurosnmkwvqtlifggaa.supabase.co
        scope: RUN_TIME
      - key: SUPABASE_ANON_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmdXJvc25ta3d2cXRsaWZnZ2FhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MjQ4MzEsImV4cCI6MjA5MzMwMDgzMX0.ZWxFA-D57GqObQM_jSQ2PvNbqfxPOY4YBd__XZiFeWA
        scope: RUN_TIME
      - key: ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: OANDA_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: OANDA_ACCOUNT_ID
        scope: RUN_TIME
        type: SECRET
      - key: CAPITAL_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: CAPITAL_IDENTIFIER
        scope: RUN_TIME
        type: SECRET
      - key: CAPITAL_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: TELEGRAM_BOT_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: TELEGRAM_CHAT_ID
        scope: RUN_TIME
        type: SECRET

workers:
  - name: scalper-worker
    github:
      repo: sybexdesign/forex-ai
      branch: main
      deploy_on_push: true
    build_command: npm install
    run_command: node workers/scalper.mjs
    environment_slug: node-js
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    envs:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://forex.sybexdesigns.co.uk
      - key: WORKER_MODE
        value: paper   # change to 'live' when ready for real orders
      - key: ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: TELEGRAM_BOT_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: TELEGRAM_CHAT_ID
        scope: RUN_TIME
        type: SECRET
      - key: SUPABASE_URL
        value: https://lfurosnmkwvqtlifggaa.supabase.co
        scope: RUN_TIME
      - key: NEXT_PUBLIC_SUPABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: WORKER_USER_ID
        scope: RUN_TIME
        type: SECRET   # set to your Supabase user ID for signal logging
